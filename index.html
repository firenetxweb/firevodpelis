<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREVODpelis</title>
    <style>
        body {
            background-color: #141414; 
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .grid-peliculas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            justify-items: center;
        }
        .pelicula-card {
            width: 120px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .pelicula-card:hover {
            transform: scale(1.05); 
        }
        .pelicula-card img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .pelicula-card p {
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #visor-video {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
        }
        #visor-video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #boton-cerrar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: red;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <h1>🎬 Estrenos VIP</h1>
    <div id="contenedor-peliculas" class="grid-peliculas"></div>

    <div id="visor-video">
        <button id="boton-cerrar" onclick="cerrarReproductor()">CERRAR X</button>
        <iframe id="iframe-video" src="" allowfullscreen></iframe>
    </div>

    <script>
        const apiKey = "ac212493"; 
        
        // Enlace de tu base de datos en Firebase
        const urlFirebase = "https://firevod-movies-default-rtdb.firebaseio.com/peliculas.json"; 
        
        const contenedor = document.getElementById("contenedor-peliculas");

        fetch(urlFirebase)
            .then(respuesta => respuesta.json())
            .then(listaPeliculas => {
                if(!listaPeliculas) {
                    contenedor.innerHTML = "<p>No hay películas en el servidor.</p>";
                    return;
                }

                listaPeliculas.forEach(id => {
                    fetch(`https://www.omdbapi.com/?i=${id}&apikey=${apiKey}`)
                        .then(res => res.json())
                        .then(datos => {
                            if (datos.Response === "True") {
                                const card = document.createElement("div");
                                card.className = "pelicula-card";
                                card.onclick = () => abrirReproductor(id); 

                                card.innerHTML = `
                                    <img src="${datos.Poster}" alt="${datos.Title}">
                                    <p>${datos.Title}</p>
                                `;
                                contenedor.appendChild(card);
                            }
                        })
                        .catch(error => console.log("Error consultando OMDb:", error));
                });
            })
            .catch(error => console.log("Error conectando a Firebase:", error));

        function abrirReproductor(idImdb) {
            const visor = document.getElementById("visor-video");
            const iframe = document.getElementById("iframe-video");
            // Usamos SuperEmbed para garantizar la reproducción limpia en móviles
            iframe.src = `https://multiembed.mov/?video_id=${idImdb}&tmdb=1`;
            visor.style.display = "block";
        }

        function cerrarReproductor() {
            const visor = document.getElementById("visor-video");
            const iframe = document.getElementById("iframe-video");
            visor.style.display = "none";
            iframe.src = ""; 
        }
    </script>
</body>
</html>
